<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TouchdownAlert</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <div id="league-chips" class="league-chips"></div>
    <div class="live-status">
      <span id="live-error" class="live-error"></span>
      <span id="live-updated" class="live-updated"></span>
      <span id="live-dot" class="live-dot live-dot-off"></span>
    </div>
  </header>

  <div id="td-banner" class="td-banner" hidden>
    <span id="td-banner-text" class="td-banner-text"></span>
    <span id="td-banner-test" class="td-banner-test" hidden>TEST</span>
  </div>

  <main>
    <section id="tiles" class="tiles-grid"></section>

    <section class="audit-panel">
      <table class="audit-table">
        <thead>
          <tr>
            <th class="col-time">Time</th>
            <th class="col-team">Team</th>
            <th class="col-player">Player</th>
          </tr>
        </thead>
        <tbody id="audit-body"></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"
          onerror="window.__signalrFailed = true"></script>
  <script src="app.js"></script>
</body>
</html>
